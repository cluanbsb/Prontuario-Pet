name: Validar JavaScript e recursos locais

on:
  push:
    branches:
      - ui/dashboard-humanizado
  pull_request:
    branches:
      - main

jobs:
  validation:
    name: Verificar sintaxe e recursos do aplicativo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -e
          for file in js/*.js; do
            echo "Verificando $file"
            node --check "$file"
          done
      - name: Verificar recursos locais do HTML
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/\b(?:src|href)=["']([^"']+)["']/g)]
            .map(match => match[1])
            .filter(ref => !/^(?:https?:|data:|#|\/\/)/i.test(ref));
          const missing = [];
          for (const ref of refs) {
            const clean = decodeURIComponent(ref.split(/[?#]/)[0]);
            if (!clean) continue;
            if (!fs.existsSync(path.resolve(clean))) missing.push(ref);
          }
          if (missing.length) {
            console.error('Recursos locais ausentes em index.html:');
            for (const ref of missing) console.error(' - ' + ref);
            process.exit(1);
          }
          console.log('Todos os ' + refs.length + ' recursos locais referenciados em index.html existem.');
          NODE
      - name: Verificar atalhos do painel e abas existentes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dashboard = fs.readFileSync('js/dashboard.js', 'utf8');
          const main = fs.readFileSync('js/render-main.js', 'utf8');
          const events = fs.readFileSync('js/eventos.js', 'utf8');
          const expectedTabs = ['vacinas', 'medicacoes', 'historico', 'perfil'];
          const errors = [];
          for (const tab of expectedTabs) {
            if (!dashboard.includes('data-home-tab="' + tab + '"')) {
              errors.push('Atalho ausente no painel: ' + tab);
            }
            if (!main.includes('data-tab="' + tab + '"')) {
              errors.push('Aba correspondente ausente na navegação: ' + tab);
            }
          }
          if (!events.includes("document.querySelectorAll('[data-home-tab]')")) {
            errors.push('Não foi encontrado o manipulador dos atalhos do painel.');
          }
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log('Os quatro atalhos do painel correspondem a abas existentes e possuem manipulador de eventos.');
          NODE
